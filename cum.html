<!DOCTYPE html> 
<html>
<head>
<meta charset="UTF-8">
<title>Feliz Cumpleaños</title>

<style>

body{
margin:0;
background:#ffecf2;
font-family:Arial;
text-align:center;
overflow:hidden;
}

/* PANTALLA 1 */
#pantalla1{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

h1{
font-size:clamp(30px, 8vw, 60px);
color:#ff3e7f;
animation:latido 1s infinite;
}

@keyframes latido{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

p{
font-size:clamp(16px, 4vw, 24px);
color:#444;
}

button{
margin-top:30px;
padding:15px 30px;
font-size:clamp(18px, 4vw, 25px);
border:none;
border-radius:20px;
background:#ff4da6;
color:white;
cursor:pointer;
}

/* PANTALLA 2 */
#pantalla2{
display:none;
position:absolute;
width:100%;
height:100%;
}

/* Girador con efecto de entrada */
#girasol{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%) scale(0.1);
border-radius:30px;
max-width:70vw;     
height:auto;
}

@keyframes crecer{
0%{transform:translateX(-50%) scale(0.1);}
100%{transform:translateX(-50%) scale(1);}
}

/* PANTALLA 3 */
#pantalla3{
display:none;
position:absolute;
width:100%;
height:100%;
}

/* FRASE TYPING */
#fraseTyping{
position:absolute;
top:10%;
left:50%;
transform:translateX(-50%);
font-size:clamp(16px,4vw,22px);
font-weight:bold;
color:#000;
max-width:90vw;
white-space:pre-wrap;
}

/* corazones en segunda pantalla */
.corazon{
position:absolute;
color:red;
font-size:clamp(20px,5vw,30px);
animation:flotar 4s ease-in forwards;
opacity:0.8;
}

@keyframes flotar{
0%{
transform:translateY(0) scale(0.8);
opacity:0.8;
}
50%{
transform:translateY(-50vh) scale(1.2);
opacity:1;
}
100%{
transform:translateY(-100vh) scale(1);
opacity:0;
}
}

</style>
</head>

<body>

<!-- PANTALLA 1 -->
<div id="pantalla1">

<h1>🎂 Feliz Cumpleaños 🎂</h1>

<p>Hoy celebramos a una persona muy especial</p>
<p>Que tu día esté lleno de amor ❤️</p>
<p>y momentos hermosos 🌸</p>

<button onclick="irPantalla2()">Aplástame aquí</button>

</div>

<!-- PANTALLA 2 -->
<div id="pantalla2">

<img id="girasol" src="girasol.jpg">

</div>

<!-- PANTALLA 3 -->
<div id="pantalla3">

<div id="fraseTyping"></div>

</div>

<audio id="musica" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

// PASO DE PANTALLA 1 → 2
function irPantalla2(){
    document.getElementById("pantalla1").style.display="none";
    document.getElementById("pantalla2").style.display="block";

    let girasol = document.getElementById("girasol");
    girasol.style.animation = "crecer 1s forwards";

    document.getElementById("musica").play();
    explosionCorazonesFlotantes();

    setTimeout(irPantalla3, 3000);
}

// PASO DE PANTALLA 2 → 3
function irPantalla3(){
    document.getElementById("pantalla2").style.display="none";
    document.getElementById("pantalla3").style.display="block";
    mostrarFraseTyping();
}

// CORAZONES BONITOS Y FLOTANTES
function explosionCorazonesFlotantes(){
    const puntos = [window.innerWidth*0.2, window.innerWidth*0.5, window.innerWidth*0.8];
    setInterval(function(){
        let corazon = document.createElement("div");
        corazon.className = "corazon";
        corazon.innerHTML = "❤️";
        corazon.style.left = puntos[Math.floor(Math.random()*puntos.length)] + "px";
        corazon.style.bottom = "0px";
        corazon.style.fontSize = (Math.random()*15 + 20) + "px"; // tamaño variable
        document.body.appendChild(corazon);
        setTimeout(()=>{ corazon.remove(); }, 4000);
    }, 400);
}

// EFECTO TYPING
function mostrarFraseTyping(){
    const frase = `Curioso, pasó el tiempo, pero aún tienes ese "algo" que no se borra. Espero que hoy te consientan como se debe... aunque creo que aún me quedas debiendo una sonrisa. Hoy eres una bebé, naciste jjj. Recuérdate de mí`;
    const cont = document.getElementById("fraseTyping");
    let i = 0;

    function escribir(){
        if(i < frase.length){
            cont.innerHTML += frase.charAt(i);
            i++;
            setTimeout(escribir, 100);
        }
    }

    escribir();
}

</script>

</body>
</html>
